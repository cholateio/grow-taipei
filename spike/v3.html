<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ---------- CC0 model loader (Kenney / Quaternius) ----------
const dracoLoader = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader().setDRACOLoader(dracoLoader), glbCache = new Map(), mixers = [];
const K = p => `assets/kenney/${p}.glb`, Q = p => `assets/quat/${p}.glb`;
function glb(path){
  if (!glbCache.has(path)) glbCache.set(path, new Promise((res, rej) => gltfLoader.load(path, res, undefined, rej)));
  return glbCache.get(path);
}
// spawn: clone a model, scale it so its height == h, drop its feet on y, optionally play an animation clip
async function spawn(path, { x = 0, y = 0, z = 0, h = 1, ry = 0, anim = null, speed = 1, parent = world, tint = null, glow = null } = {}){
  const src = await glb(path);
  const obj = SkeletonUtils.clone(src.scene);
  // skinned meshes need posed bones before their bounds mean anything
  obj.updateMatrixWorld(true); obj.traverse(o => { if (o.isSkinnedMesh){ o.skeleton.update(); o.computeBoundingBox(); } });
  const box = new THREE.Box3().setFromObject(obj, true), size = box.getSize(new THREE.Vector3());
  const s = h / size.y; obj.scale.setScalar(s);
  obj.updateMatrixWorld(true); obj.traverse(o => { if (o.isSkinnedMesh) o.computeBoundingBox(); });
  const box2 = new THREE.Box3().setFromObject(obj, true), c = box2.getCenter(new THREE.Vector3());
  const holder = new THREE.Group();
  obj.position.set(-c.x, -box2.min.y, -c.z); holder.add(obj);
  holder.position.set(x, y, z); holder.rotation.y = ry;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    // unify look: PBR → flat Lambert, same colour / texture / vertex colours as the rest of the island
    const conv = m => {
      const lit = m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.2;
      const n = new THREE.MeshLambertMaterial({ map: m.map || null, vertexColors: !!m.vertexColors, flatShading: true, transparent: m.transparent, opacity: m.opacity, side: m.side });
      n.color.copy(m.color);
      if (tint) for (const k in tint) if (new RegExp(k, 'i').test(m.name || '')) n.color.setHex(tint[k]);
      // the mirror stripped some texture atlases (e.g. cyberpunk sign faces): paint those materials as neon instead
      if (glow) for (const k in glow) if (new RegExp(k, 'i').test(m.name || '')){ n.color.setHex(glow[k]); n.emissive.setHex(glow[k]); glows.push({ m: n, dayI: 0.5, nightI: 2.5 }); return n; }
      if (lit){ n.emissive.copy(m.emissive); glows.push({ m: n, dayI: 0.6, nightI: 2.0 }); }
      return n;
    };
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
  if (anim && src.animations.length){
    const clip = src.animations.find(a => a.name.toLowerCase().includes(anim.toLowerCase())) || src.animations[0];
    const mixer = new THREE.AnimationMixer(obj); const act = mixer.clipAction(clip); act.timeScale = speed; act.play(); mixers.push(mixer);
  }
  parent.add(holder); return holder;
}

const C = { sea:0x4fa6b4, seaDeep:0x3f90a0, cream:0xfff8f4, sand:0xe9dcc6, coral:0xdb6a41, ink:0x211d1d, yellow:0xfcea8b,
  grass:0xbfd39c, grass2:0xa9c488, lawn:0xcfe0a8, cliff:0xd2b48c, cliff2:0xc2a27a, tree:0x9bbd7e, tree2:0x8aaf70, treeDark:0x6f9560,
  trunk:0x9c7a4e, wall:0xf1e7da, wallDark:0xe4d6c2, window:0x5c5650, roof:0xdb6a41, stone:0xe6dccb, glass:0x9cc3bf, mountain:0xb3c79a, mountainFar:0xc5d6b3,
  skin:0xf3c9a5, hair:0x3a2a22, white:0xffffff, plateau:0xd9cbb4 };
const SHIRTS = [0xdb6a41, 0x5a88b2, 0xf2b5c6, 0x8db86f, 0xfcea8b, 0xffffff, 0x3f5a8a, 0xe8b04a];
const params = new URLSearchParams(location.search);
let level101 = +params.get('lv') || 2;
let timeKey = ['day','dusk','night'].includes(params.get('time')) ? params.get('time') : 'day';
let treeKey = ['proc','kenney','quat'].includes(params.get('trees')) ? params.get('trees') : 'kenney';

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- renderer / camera ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const labelR = new CSS2DRenderer({ element: document.getElementById('labels') });
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8df, 45, 130);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 300);
const target = new THREE.Vector3(0.3, 0.4, 0.3);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(target); controls.enablePan = false; controls.enableDamping = true;
controls.minDistance = 6; controls.maxDistance = 70; controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.25;
function placeCamera(){
  const aspect = innerWidth / innerHeight, focus = params.get('focus');
  let dist = Math.max(36, 46 / aspect), pol = 1.02, az = 0.55;
  if (focus === 'cyber'){ target.set(-8.2, 0.6, 6.4); dist = 11; pol = 1.1; }
  if (focus === 'alien'){ target.set(9.6, 1.2, -5.8); dist = 12; pol = 1.1; }
  if (focus === 'main'){ target.set(1.5, 0.3, 1.5); dist = 16; pol = 1.0; }
  controls.target.copy(target);
  camera.position.set(target.x + Math.sin(pol)*Math.sin(az)*dist, target.y + Math.cos(pol)*dist, target.z + Math.sin(pol)*Math.cos(az)*dist);
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); labelR.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); placeCamera();

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xfff8f4, 0x8fa68a, 1.1);
const sun = new THREE.DirectionalLight(0xfff1de, 2.2);
sun.position.set(12, 20, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-16, right:16, top:16, bottom:-16, near:1, far:70 }); sun.shadow.bias = -0.0006; sun.shadow.radius = 4;
scene.add(hemi, sun);
const lampLights = [];

// ---------- materials ----------
const matCache = new Map();
function mat(color, extra){
  if (extra) return new THREE.MeshLambertMaterial({ color, flatShading: true, ...extra });
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshLambertMaterial({ color, flatShading: true }));
  return matCache.get(color);
}
const glows = [];
function glowMat(color, emissive, dayI, nightI){ const m = mat(color, { emissive }); glows.push({ m, dayI, nightI }); return m; }
function M(geo, m, { cast = true } = {}){ const mesh = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m); mesh.castShadow = cast; mesh.receiveShadow = true; return mesh; }

// ---------- island pieces ----------
function softHex(r, per, jitter, round, rnd){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a0 = Math.PI/2 + i*Math.PI/3, a1 = a0 + Math.PI/3;
    for (let k = 0; k < per; k++){
      const t = k / per;
      let x = Math.cos(a0)*(1-t) + Math.cos(a1)*t, y = Math.sin(a0)*(1-t) + Math.sin(a1)*t;
      const len = Math.hypot(x, y); x = x*(1-round) + x/len*round; y = y*(1-round) + y/len*round;
      const j = r * (1 + (rnd()-0.5)*jitter);
      pts.push(new THREE.Vector2(x*j, y*j));
    }
  }
  return pts;
}
function slab(pts, x, z, y0, h, taper){
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: h, bevelEnabled: false });
  g.rotateX(-Math.PI/2); g.translate(x, y0, z);
  if (taper !== 1){
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) if (p.getY(i) < y0 + 1e-4){ p.setX(i, x + (p.getX(i)-x)*taper); p.setZ(i, z + (p.getZ(i)-z)*taper); }
    p.needsUpdate = true; g.computeVertexNormals();
  }
  return g;
}
// puma-style tier: sharp hex, pale cliff, thin white rim platform, sand shelf under water
function tier(group, { r, x = 0, z = 0, y0, h, seed, top = C.grass, rim = true, round = 0.15, jitter = 0.03 }){
  const rnd = () => mulberry(seed);
  group.add(M(slab(softHex(r, 4, jitter, round, rnd()), x, z, y0, h, 0.86), [mat(top), mat(C.cliff)]));
  if (rim){
    const shape = new THREE.Shape(softHex(r*1.04, 4, jitter, round, rnd()));
    shape.holes.push(new THREE.Path(softHex(r*0.94, 4, jitter, round, rnd()).reverse()));
    const g = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: false }); g.rotateX(-Math.PI/2); g.translate(x, y0 + h - 0.08, z);
    group.add(M(g, C.white));
  }
  group.add(M(slab(softHex(r*1.22, 4, jitter, round, rnd()), x, z, -1.35, 0.3, 0.9), mat(C.sand, { transparent: true, opacity: 0.55 }), { cast: false }));
  return softHex(r, 4, jitter, round, rnd()).map(v => new THREE.Vector2(v.x + x, -v.y + z));
}
const treeGeo = new THREE.IcosahedronGeometry(1, 1), trunkGeo = new THREE.CylinderGeometry(0.06, 0.08, 1, 5), potGeo = new THREE.BoxGeometry(0.32, 0.18, 0.32);
function tree(s = 1, color = C.tree, pot = true){
  const g = new THREE.Group();
  const trunk = M(trunkGeo, C.trunk); trunk.scale.y = 0.5; trunk.position.y = 0.25; g.add(trunk);
  const ball = M(treeGeo, color); ball.scale.setScalar(0.42); ball.position.y = 0.7; ball.rotation.y = s * 7; g.add(ball);
  if (pot){ const p = M(potGeo, C.wallDark); p.position.y = 0.09; g.add(p); }
  g.scale.setScalar(s); return g;
}
function building({ w = 1.2, h = 0.9, d = 1.0, roof = C.roof, stripes = 3, clock = false }){
  const g = new THREE.Group();
  const body = M(new THREE.BoxGeometry(w, h, d), C.wall); body.position.y = h/2; g.add(body);
  const win = mat(C.window);
  for (let i = 0; i < stripes; i++){
    const x = -w/2 + (i + 0.5) * w / stripes;
    const s = M(new THREE.BoxGeometry(0.1, h * 0.7, 0.03), win); s.position.set(x, h/2, d/2 + 0.015); g.add(s);
    const s2 = s.clone(); s2.position.set(w/2 + 0.015, h/2, -d/2 + (i + 0.5) * d / stripes); s2.rotation.y = Math.PI/2; g.add(s2);
  }
  const top = M(new THREE.BoxGeometry(w + 0.12, 0.12, d + 0.12), roof); top.position.y = h + 0.06; g.add(top);
  if (clock){
    const t = M(new THREE.BoxGeometry(0.36, 1.3, 0.36), C.roof); t.position.set(w/2 - 0.1, 0.65, d/2 - 0.1); g.add(t);
    const face = M(new THREE.CylinderGeometry(0.13, 0.13, 0.04, 12), C.yellow); face.rotation.x = Math.PI/2; face.position.set(w/2 - 0.1, 1.0, d/2 + 0.1); g.add(face);
    const spire = M(new THREE.ConeGeometry(0.26, 0.35, 4), C.roof); spire.rotation.y = Math.PI/4; spire.position.set(w/2 - 0.1, 1.47, d/2 - 0.1); g.add(spire);
  }
  return g;
}
function cottage(roof = C.roof){
  const g = new THREE.Group();
  const w = M(new THREE.BoxGeometry(0.7, 0.5, 0.6), C.wall); w.position.y = 0.25; g.add(w);
  const r = M(new THREE.ConeGeometry(0.58, 0.42, 4), roof); r.position.y = 0.71; r.rotation.y = Math.PI/4; g.add(r);
  return g;
}
function lamp(){
  const g = new THREE.Group();
  const post = M(new THREE.CylinderGeometry(0.025, 0.035, 0.9, 5), C.ink); post.position.y = 0.45; g.add(post);
  const head = M(new THREE.BoxGeometry(0.16, 0.1, 0.16), glowMat(C.cream, 0xffd36b, 0, 2.5)); head.position.y = 0.95; g.add(head);
  const l = new THREE.PointLight(0xffc96b, 0, 5, 2); l.position.y = 0.9; g.add(l); lampLights.push(l);
  return g;
}
function person(rnd){
  const g = new THREE.Group(), shirt = mat(SHIRTS[Math.floor(rnd() * SHIRTS.length)]);
  const body = M(new THREE.CapsuleGeometry(0.13, 0.18, 3, 8), shirt); body.position.y = 0.42; g.add(body);
  const pants = M(new THREE.CylinderGeometry(0.12, 0.11, 0.16, 8), rnd() < 0.5 ? C.ink : 0x5a88b2); pants.position.y = 0.26; g.add(pants);
  const head = M(new THREE.SphereGeometry(0.2, 12, 10), C.skin); head.position.y = 0.78; g.add(head);
  const hair = M(new THREE.SphereGeometry(0.215, 12, 8, 0, Math.PI*2, 0, Math.PI*0.55), C.hair); hair.position.y = 0.8; hair.rotation.y = rnd() * 6; g.add(hair);
  if (rnd() < 0.4){ const bun = M(new THREE.SphereGeometry(0.09, 8, 6), C.hair); bun.position.set(0, 0.96, -0.1); g.add(bun); }
  const limb = (r, l, x, y) => { const p = new THREE.Group(); const m = M(new THREE.CapsuleGeometry(r, l, 2, 6), shirt); m.position.y = -l/2; p.add(m); p.position.set(x, y, 0); return p; };
  const armL = limb(0.04, 0.18, -0.16, 0.52), armR = limb(0.04, 0.18, 0.16, 0.52);
  const legL = limb(0.05, 0.1, -0.06, 0.2), legR = limb(0.05, 0.1, 0.06, 0.2);
  legL.children[0].material = legR.children[0].material = mat(C.ink);
  g.add(armL, armR, legL, legR);
  return { g, armL, armR, legL, legR };
}
function crane(h){
  const g = new THREE.Group(), y = 0xe8c547;
  const mast = M(new THREE.BoxGeometry(0.1, h, 0.1), y); mast.position.y = h/2; g.add(mast);
  const jib = new THREE.Group(); jib.position.y = h;
  const arm = M(new THREE.BoxGeometry(2.0, 0.08, 0.08), y); arm.position.x = -0.6; jib.add(arm);
  const cw = M(new THREE.BoxGeometry(0.3, 0.2, 0.2), 0x6d6a66); cw.position.x = 0.35; jib.add(cw);
  const cable = M(new THREE.BoxGeometry(0.015, 0.8, 0.015), C.ink, { cast: false }); cable.position.set(-1.3, -0.4, 0); jib.add(cable);
  const load = M(new THREE.BoxGeometry(0.3, 0.14, 0.3), C.glass); load.position.set(-1.3, -0.85, 0); jib.add(load);
  g.add(jib); g.userData.jib = jib; return g;
}
function build101(level){
  const g = new THREE.Group(), glass = mat(C.glass), trim = glowMat(C.cream, 0x9fe8ff, 0, 1.4);
  const pod = M(new THREE.BoxGeometry(1.8, 0.3, 1.8), C.plateau); pod.position.y = 0.15; g.add(pod);
  const baseH = level === 1 ? 0.5 : 1.1;
  const base = M(new THREE.CylinderGeometry(0.5, 0.62, baseH, 4), glass); base.rotation.y = Math.PI/4; base.position.y = 0.3 + baseH/2; g.add(base);
  let y = 0.3 + baseH; const n = level >= 3 ? 8 : level === 2 ? 4 : 0;
  for (let i = 0; i < n; i++){
    const s = M(new THREE.CylinderGeometry(0.58, 0.42, 0.42, 4), glass); s.rotation.y = Math.PI/4; s.position.y = y + 0.21; g.add(s);
    const ring = M(new THREE.BoxGeometry(0.84, 0.05, 0.84), trim); ring.position.y = y + 0.43; g.add(ring); y += 0.45;
  }
  if (level >= 3){
    const cap = M(new THREE.CylinderGeometry(0.22, 0.34, 0.4, 4), glass); cap.rotation.y = Math.PI/4; cap.position.y = y + 0.2; g.add(cap);
    const spire = M(new THREE.CylinderGeometry(0.02, 0.06, 1.1, 6), trim); spire.position.y = y + 0.95; g.add(spire);
  } else {
    const c = crane(y + 1.2); c.position.set(0.95, 0, 0.7); g.add(c); g.userData.crane = c;
    for (const [cx, cz] of [[-0.75, 0.95], [0.1, 0.98], [-0.95, 0.2]]){ const cone = M(new THREE.ConeGeometry(0.07, 0.18, 6), 0xf08a3c); cone.position.set(cx, 0.09, cz); g.add(cone); }
  }
  return g;
}
function label(text, num, x, y, z){
  const el = document.createElement('div'); el.className = 'pill'; el.innerHTML = `<b>${num}</b>${text}`;
  const o = new CSS2DObject(el); o.position.set(x, y, z); return o;
}

// ---------- satellite islets ----------
function islet(kind, x, z, seed){
  const g = new THREE.Group(), rnd = mulberry(seed);
  tier(g, { r: 1.3 + rnd() * 0.5, y0: -1.3, h: 1.25, seed, top: kind === 'rocks' ? C.sand : C.grass, rim: false, round: 0.5, jitter: 0.1 });
  const put = (m, px, pz, ry = 0) => { m.position.set(px, -0.05, pz); m.rotation.y = ry; g.add(m); return m; };
  if (kind === 'lighthouse'){
    const t = new THREE.Group();
    for (let i = 0; i < 4; i++){ const s = M(new THREE.CylinderGeometry(0.22 - i*0.02, 0.24 - i*0.02, 0.32, 10), i % 2 ? C.roof : C.white); s.position.y = 0.16 + i*0.32; t.add(s); }
    const top = M(new THREE.CylinderGeometry(0.16, 0.16, 0.2, 10), glowMat(C.yellow, 0xffd36b, 0, 2)); top.position.y = 1.38; t.add(top);
    const cap = M(new THREE.ConeGeometry(0.2, 0.2, 10), C.ink); cap.position.y = 1.58; t.add(cap);
    put(t, 0, 0); put(tree(0.8), 0.7, 0.4);
  } else if (kind === 'windmill'){
    const t = new THREE.Group();
    const post = M(new THREE.CylinderGeometry(0.04, 0.06, 1.4, 6), C.white); post.position.y = 0.7; t.add(post);
    const hub = new THREE.Group(); hub.position.set(0, 1.4, 0.08);
    for (let i = 0; i < 3; i++){ const b = M(new THREE.BoxGeometry(0.08, 0.7, 0.03), C.white); b.position.y = 0.35; const p = new THREE.Group(); p.add(b); p.rotation.z = i * Math.PI*2/3; hub.add(p); }
    t.add(hub); t.userData.spin = hub; put(t, 0, 0); put(cottage(0x5a88b2), -0.6, 0.3, 0.5);
  } else if (kind === 'rocks'){
    for (let i = 0; i < 4; i++){ const r = M(new THREE.DodecahedronGeometry(0.25 + rnd()*0.3, 0), 0xc9b9a4); put(r, (rnd()-0.5)*1.4, (rnd()-0.5)*1.4, rnd()*3); r.position.y = 0.1; }
  } else if (kind === 'pyramid'){
    for (let i = 0; i < 5; i++){ const s = M(new THREE.CylinderGeometry(0.9 - i*0.17, 0.95 - i*0.17, 0.18, 8), i % 2 ? C.grass2 : C.lawn); s.position.y = 0.09 + i*0.18; g.add(s); }
  } else if (kind === 'playground'){
    const slide = M(new THREE.BoxGeometry(0.2, 0.08, 0.9), C.roof); slide.rotation.x = 0.5; put(slide, 0.3, 0); slide.position.y = 0.3;
    const post = M(new THREE.BoxGeometry(0.35, 0.7, 0.35), C.yellow); put(post, 0.3, -0.45); post.position.y = 0.35;
    const roofP = M(new THREE.ConeGeometry(0.4, 0.3, 4), 0x5a88b2); roofP.rotation.y = Math.PI/4; put(roofP, 0.3, -0.45); roofP.position.y = 0.85;
    put(tree(0.7), -0.6, 0.4);
  } else if (kind === 'forest'){
    for (let i = 0; i < 5; i++) put(tree(0.7 + rnd()*0.5, [C.tree, C.tree2, C.treeDark][i % 3]), (rnd()-0.5)*1.6, (rnd()-0.5)*1.6, rnd()*6);
    put(cottage(), 0, 0, 0.3);
  }
  g.position.set(x, 0, z); return g;
}

// ---------- background hills ----------
function hills(){
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(220, 90, 70, 30), p = geo.attributes.position, rnd = mulberry(99);
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i), t = (y + 45) / 90; // t=0 near shore, 1 far
    let h = Math.max(0, t - 0.08) * 26 + Math.sin(x * 0.11) * 3 * t + Math.sin(x * 0.31 + 2) * 1.5 * t + (rnd() - 0.5) * 1.6 * t;
    p.setZ(i, h);
  }
  geo.computeVertexNormals();
  const m = M(geo, C.mountain, { cast: false }); m.rotation.x = -Math.PI/2; m.position.set(-10, -1.2, -48); g.add(m);
  // instanced trees on the slopes
  const count = 1400, inst = new THREE.InstancedMesh(new THREE.ConeGeometry(0.55, 1.4, 6), mat(C.treeDark), count), d = new THREE.Object3D();
  const r2 = mulberry(5);
  for (let i = 0; i < count; i++){
    const x = (r2() - 0.5) * 200, y = (r2() * 0.9 + 0.1) * 90 - 45, t = (y + 45) / 90;
    const h = Math.max(0, t - 0.08) * 26 + Math.sin(x * 0.11) * 3 * t + Math.sin(x * 0.31 + 2) * 1.5 * t;
    d.position.set(x - 10, -1.2 + h + 0.6, -48 - y); d.scale.setScalar(0.8 + r2() * 1.0); d.rotation.y = r2() * 6; d.updateMatrix(); inst.setMatrixAt(i, d.matrix);
  }
  inst.castShadow = false; g.add(inst);
  for (let i = 0; i < 8; i++){
    const x = (r2() - 0.5) * 120, y = r2() * 25 + 5, t = (y + 45) / 90;
    const h = Math.max(0, t - 0.08) * 26 + Math.sin(x * 0.11) * 3 * t + Math.sin(x * 0.31 + 2) * 1.5 * t;
    const c = cottage([C.roof, 0x5a88b2, C.roof][i % 3]); c.scale.setScalar(1.6); c.position.set(x - 10, -1.2 + h, -48 - y); g.add(c);
  }
  return g;
}

  const N = 26, tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.05, 0.32), mat(C.stone), N), d = new THREE.Object3D(); tiles.receiveShadow = true;

function setTrees(key){ treeKey = key; for (const k in treeSets) treeSets[k].visible = (k === key); }
function setTower(level, animate){
  if (tower) towerAnchor.remove(tower);
  tower = build101(level); towerAnchor.add(tower); applyTime();
  if (animate){
    tower.userData.pop = 0; const rnd = mulberry(level * 97);
    for (let i = 0; i < 10; i++){
      const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 0), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
      const a = rnd() * 6.28; p.userData = { t: 0, v: new THREE.Vector3(Math.cos(a), 0.4 + rnd() * 0.6, Math.sin(a)).multiplyScalar(1.6 + rnd()) };
      p.position.set(3.4, 0.4, -1.6); world.add(p); puffs.push(p);
    }
  }
}
const TIMES = {
  day:   { bg: 'linear-gradient(#f4eee3 0%,#dfe8df 45%,#9fcfd4 100%)', fog: 0xdfe8df, hemi: [0xfff8f4, 0x8fa68a, 1.1], sun: [0xfff1de, 2.2, [12, 20, 8]], glow: 0, lamp: 0, sea: C.sea, exp: 1.05 },
  dusk:  { bg: 'linear-gradient(#f9c9a0 0%,#e9b7a8 45%,#7f9fb0 100%)', fog: 0xe9b7a8, hemi: [0xffd9b0, 0x6f6a80, 0.8], sun: [0xffb070, 1.6, [-16, 8, 10]], glow: 0.8, lamp: 3, sea: 0x5c8fa4, exp: 1.0 },
  night: { bg: 'linear-gradient(#1b2340 0%,#2c3a63 50%,#3f5a80 100%)', fog: 0x2c3a63, hemi: [0x5a70c0, 0x1a2238, 0.55], sun: [0x94a2d8, 0.55, [-8, 18, -6]], glow: 1, lamp: 6, sea: 0x2f5f80, exp: 0.9 },
};
function applyTime(){
  const T = TIMES[timeKey];
  document.body.style.background = T.bg; scene.fog.color.setHex(T.fog);
  hemi.color.setHex(T.hemi[0]); hemi.groundColor.setHex(T.hemi[1]); hemi.intensity = T.hemi[2];
  sun.color.setHex(T.sun[0]); sun.intensity = T.sun[1]; sun.position.set(...T.sun[2]);
  renderer.toneMappingExposure = T.exp;
  for (const g of glows) g.m.emissiveIntensity = g.dayI + (g.nightI - g.dayI) * T.glow;
  lampLights.forEach(l => l.intensity = T.lamp);
  world.children[0].material.color.setHex(T.sea);
}

// ---------- animation ----------
const dummy = new THREE.Object3D(), easeOutBack = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  foamData.forEach((f, i) => { dummy.position.set(f.x, -0.93, f.z); dummy.rotation.set(-Math.PI/2, 0, 0); dummy.scale.setScalar(f.r * (0.85 + 0.15 * Math.sin(t * 1.6 + f.ph))); dummy.updateMatrix(); foam.setMatrixAt(i, dummy.matrix); });
  foam.instanceMatrix.needsUpdate = true;
  for (const s of steam){ const p = (s.ph + t * 0.18) % 1; s.m.position.set(s.x + Math.sin(p * 5) * 0.15, s.y + p * 1.8, s.z); s.m.scale.setScalar(s.s * (0.5 + p)); s.m.material.opacity = 0.8 * (1 - p); }
  for (const w of walkers){
    if (w.idle){ w.armR.rotation.z = 0.3 + Math.sin(t * 2 + w.g.position.x) * 0.15; continue; }
    w.u += w.dir * dt * w.speed; if (w.u > 0.98 || w.u < 0.02){ w.dir *= -1; w.u = THREE.MathUtils.clamp(w.u, 0.02, 0.98); }
    const p = pathCurve.getPointAt(w.u), tg = pathCurve.getTangentAt(w.u).multiplyScalar(w.dir), sw = Math.sin(t * 9 + w.u * 40);
    w.g.position.set(p.x, Math.abs(sw) * 0.04, p.z); w.g.rotation.y = Math.atan2(tg.x, tg.z);
    w.legL.rotation.x = sw * 0.6; w.legR.rotation.x = -sw * 0.6; w.armL.rotation.x = -sw * 0.5; w.armR.rotation.x = sw * 0.5;
  }
  world.traverse(o => { if (o.userData.spin) o.userData.spin.rotation.z += dt * 1.2; });
  for (const b of boats){ b.userData.a += dt * b.userData.s * 0.3; b.position.set(Math.cos(b.userData.a) * b.userData.r, -0.95 + Math.sin(t * 2 + b.userData.r) * 0.03, Math.sin(b.userData.a) * b.userData.r); b.rotation.y = -b.userData.a; }
  for (const m of mixers) m.update(dt);
  if (ufo){ ufo.position.y = 3.2 + Math.sin(t * 1.3) * 0.25; ufo.rotation.y += dt * 0.6; }
  if (tower){
    const c = tower.userData.crane; if (c) c.userData.jib.rotation.y = Math.sin(t * 0.4) * 0.9;
    if (tower.userData.pop !== undefined){ const k = Math.min(1, (tower.userData.pop += dt / 0.7)); tower.scale.set(1 + 0.15 * Math.sin(k * Math.PI), Math.max(0.01, easeOutBack(k)), 1 + 0.15 * Math.sin(k * Math.PI)); if (k >= 1) delete tower.userData.pop; }
  }
  for (let i = puffs.length - 1; i >= 0; i--){ const p = puffs[i], u = (p.userData.t += dt / 0.9); p.position.addScaledVector(p.userData.v, dt * (1 - u)); p.scale.setScalar(0.6 + u * 1.4); p.material.opacity = 1 - u; if (u >= 1){ world.remove(p); puffs.splice(i, 1); } }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});

// ---------- UI ----------
const $$ = s => [...document.querySelectorAll(s)];
$$('[data-time]').forEach(b => b.onclick = () => { timeKey = b.dataset.time; $$('[data-time]').forEach(x => x.classList.toggle('on', x === b)); applyTime(); });
$$('[data-lv]').forEach(b => b.onclick = () => { const lv = +b.dataset.lv; $$('[data-lv]').forEach(x => x.classList.toggle('on', x === b)); if (lv !== level101){ level101 = lv; setTower(lv, true); } });
$$('[data-trees]').forEach(b => b.onclick = () => { setTrees(b.dataset.trees); $$('[data-trees]').forEach(x => x.classList.toggle('on', x === b)); });
$$('[data-time]').forEach(x => x.classList.toggle('on', x.dataset.time === timeKey)); $$('[data-lv]').forEach(x => x.classList.toggle('on', +x.dataset.lv === level101)); $$('[data-trees]').forEach(x => x.classList.toggle('on', x.dataset.trees === treeKey));
buildWorld();
