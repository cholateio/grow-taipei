<title>GROW 小小世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 最終版：回到自家繪本畫風。層疊丘陵的淺 2.5D、跨物件道具（小溪/索道/浮島光束）、三幕演出與行走。 */
:root{
  --sky1:#b7ddf0; --sky2:#f0f7e2;
  --paper:#fbf4e4; --ink:#3d372c;
  --hill1:#a3d089; --hill2:#7fb86c; --hill3:#5f9fb8;
  --accent:#d96a3b; --gold:#e8b63a; --plum:#7a5ba3;
  --bad:#c0442c;
  --shadow:0 3px 0 rgba(61,55,44,.25);
}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;
}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:1.35rem;font-weight:900;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 .en{color:var(--accent);margin-right:.2em}
.sub{font-size:.8rem;opacity:.75}

.stage{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));box-shadow:var(--shadow)}
.stage svg{display:block;width:100%;height:auto}

.caption{
  min-height:2.2em;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:.92rem;font-weight:700;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:.45em .9em;box-shadow:var(--shadow)
}
.caption.flash{animation:cap .35s ease}
@keyframes cap{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}

.panel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:620px){.panel{grid-template-columns:repeat(3,1fr)}}
@media(max-width:430px){.panel{grid-template-columns:repeat(2,1fr)}}
button.item{
  position:relative;
  font:inherit;font-weight:700;color:var(--ink);background:#fff;
  border:2.5px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);
  padding:.4em .3em .45em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  transition:transform .08s ease
}
button.item:not(:disabled):hover{transform:translateY(-2px);background:#fffdf4}
button.item:not(:disabled):active{transform:translateY(1px)}
button.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.item:disabled{opacity:.5;cursor:default;box-shadow:none}
button.item .nm{font-size:.84rem}
button.item svg.mini{width:42px;height:38px;overflow:visible}
button.item .ord{
  position:absolute;top:4px;right:6px;display:none;
  background:#a32638;color:#fff;font-size:.7rem;font-weight:900;
  padding:0 .4em;border-radius:5px;border:1.5px solid #fff;
}
.pips{display:flex;gap:3px;height:8px}
.pip{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}
.pip.on{background:var(--accent)}
.pips.maxed .pip.on{background:var(--gold)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.turn{font-weight:900;font-size:.95rem}
.turn b{color:var(--accent)}
button.ghost{
  font:inherit;font-weight:700;background:transparent;color:var(--ink);
  border:2px solid var(--ink);border-radius:10px;padding:.35em .9em;cursor:pointer
}
button.ghost:hover{background:#fff}
button.ghost:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.ghost.on{background:var(--ink);color:var(--paper)}

.ending{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:rgba(61,55,44,.8);color:var(--paper);text-align:center;padding:20px;
  animation:cap .4s ease
}
.ending .big{font-size:1.65rem;font-weight:900;letter-spacing:.08em}
.ending .big.good{color:var(--gold)}
.ending .big.bad{color:#ffb199}
.ending .msg{font-size:.95rem;max-width:34em}
.ending .score{font-size:.8rem;opacity:.85}

/* ===== 動畫庫 ===== */
svg .inner{transform-box:fill-box;transform-origin:50% 100%}
.idle-wobble{animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{25%{transform:scale(1.05,.95)}75%{transform:scale(.96,1.05)}}
.idle-float{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.spin.fast{animation-duration:2.4s}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{transform-box:fill-box;transform-origin:left center;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(7deg)}}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.note{animation:noteRise 2.4s linear infinite;transform-box:fill-box}
@keyframes noteRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.sway{transform-box:fill-box;transform-origin:top center;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}
.flow{stroke-dasharray:4 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.12,.9)}100%{transform:scale(1)}}
.bump{animation:bump .5s ease}
@keyframes bump{25%{transform:scale(1.22,.82)}55%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
.shrink{animation:shrink .5s ease}
@keyframes shrink{30%{transform:scale(.7,1.2)}60%{transform:scale(1.15,.8)}100%{transform:scale(1)}}
.nudge{animation:nudge .34s ease}
@keyframes nudge{30%{transform:rotate(-4deg) translateY(-2px)}70%{transform:rotate(3deg)}100%{transform:none}}
.chargeA{animation:chargeA .42s ease-in}
@keyframes chargeA{0%{transform:scale(1)}45%{transform:scale(1.07)}75%{transform:scale(.94,1.06)}100%{transform:scale(1.03)}}
.walkA{animation:walkA .3s ease-in-out infinite}
@keyframes walkA{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.maxstar{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.float{animation:rise 1s ease forwards;transform-box:fill-box}
.float.down{fill:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.angry{animation:rise 1s ease forwards;transform-box:fill-box}
.fly{animation:flyMove var(--dur,.5s) ease-in forwards;opacity:0}
@keyframes flyMove{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:.9;transform:translate(var(--dx),var(--dy))}}
.burststar{animation:bs .55s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes bs{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1);opacity:0}}
.fw{animation:fw .9s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes fw{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1.1);opacity:0}}
@media(prefers-reduced-motion:reduce){
  .idle-wobble,.idle-float,.spin,.wave,.blink,.note,.sway,.rays,.drift,.flow,
  .pop,.bump,.shrink,.nudge,.chargeA,.walkA,.maxstar,.float,.angry,.fly,.burststar,.fw,.caption.flash,.ending{animation:none}
  .float,.angry,.fly,.burststar,.fw,.note{opacity:0}
}

details.spec{font-size:.82rem;border:2px dashed var(--ink);border-radius:10px;padding:.5em .8em;background:#fff}
details.spec summary{cursor:pointer;font-weight:700}
details.spec pre{overflow-x:auto;background:var(--paper);padding:.6em;border-radius:8px;font-size:.72rem;line-height:1.5}
details.spec table{border-collapse:collapse;font-size:.78rem;margin:.4em 0}
details.spec td,details.spec th{border:1.5px solid var(--ink);padding:.2em .5em;font-variant-numeric:tabular-nums}
footer{font-size:.74rem;opacity:.7;text-align:center}
</style>

<script>
"use strict";
/* ================= SPEC ================= */
const ITEMS = [
  { id:"stone",  name:"石頭", max:4, tick:{always:true},
    levels:["石頭","石堆","石塔","石巨人"], idle:"" },
  { id:"drop",   name:"水滴", max:3, tick:{ltPlus:["drop","stone",0]},
    levels:["水窪","池塘","噴泉"], idle:"" },
  { id:"seed",   name:"種子", max:4, tick:{and:[{present:"drop"},{ltPlus:["seed","drop",2]}]},
    levels:["嫩芽","草叢","大樹","結果的大樹"], idle:"" },
  { id:"slime",  name:"黏液", max:3, tick:{present:"drop"},
    levels:["黏液","史萊姆","史萊姆王"], idle:"idle-wobble" },
  { id:"gear",   name:"齒輪", max:4, tick:{minLevel:["stone",2]},
    levels:["齒輪","齒輪組","機關台","大風車機關"], idle:"" },
  { id:"box",    name:"箱子", max:3, tick:{minLevel:["gear",2]},
    levels:["木箱","小攤位","纜車站"], idle:"" },
  { id:"ball",   name:"球",   max:3, tick:{minLevel:["gear",3]},
    levels:["球","彈彈球","滾輪車"], idle:"" },
  { id:"rope",   name:"繩子", max:3, tick:{and:[{minLevel:["seed",3]},{present:"box"}]},
    levels:["繩圈","繩橋","纜車索道"], idle:"" },
  { id:"horn",   name:"喇叭", max:2, tick:{minLevel:["box",3]},
    levels:["喇叭","樂隊舞台"], idle:"" },
  { id:"magnet", name:"磁鐵", max:2, tick:{and:[{minLevel:["gear",4]},{minLevel:["ball",3]}]},
    levels:["磁鐵","浮空燈塔"], idle:"idle-float" },
];
const EXTRA = {
  stone: [ {absent:"box"} ],
  ball:  [ {maxLevel:["gear",3]} ],
  horn:  [ {absent:"ball"} ],
};
const FX = {
  drop:   [ {t:"slime", d:+1, req:{present:"slime"}, medium:"splash", move:"target", story:"水花濺起——黏液咕嚕咕嚕喝了起來！"} ],
  horn:   [ {t:"ball",  d:-9, req:{present:"ball"},  medium:"soundwave", move:"flee", story:"喇叭巨響！球嚇得縮回了原形……", down:true} ],
};
const STALL = [
  { target:"gear", when:{and:[{present:"slime"},{maxLevel:["slime",1]}]}, cause:"slime", story:"齒輪被黏液黏住了" },
];
const PERF = {
  stone:  { cause:"stone",  medium:"pebble", move:null,     line:"又一塊石頭疊了上去。" },
  drop:   { cause:"stone",  medium:"dig",    move:"cause",  line:"石巨人走到池邊，把池子又挖大了些。" },
  seed:   { cause:"drop",   medium:"rain",   move:null,     line:"水珠灑落，澆灌著植物。" },
  slime:  { cause:"drop",   medium:"rain",   move:"target", line:"黏液挪到池邊，咕嚕咕嚕地喝著水。" },
  gear:   { cause:"stone",  medium:"part",   move:"cause",  line:"石巨人走來，為機關裝上新零件。" },
  box:    { cause:"gear",   medium:"plank",  move:null,     line:"機關敲敲打打，為箱子加工。" },
  ball:   { cause:"gear",   medium:"polish", move:"target", line:"球滾到機關旁，被打磨得又圓又亮。" },
  rope:   { cause:"seed",   medium:"strand", move:null,     line:"繩子一圈圈攀上了大樹。" },
  horn:   { cause:"box",    medium:"plank",  move:null,     line:"站前敲敲打打，搭起了舞台。" },
  magnet: { cause:"gear",   medium:"spark",  move:null,     line:"電力接通——磁鐵嗡嗡作響！" },
};
const ENDINGS = {
  good: { big:"🏆 TRUE END", msg:"浮空燈塔亮起，纜車載著大家滑向車站，樂隊奏響終曲，煙火升空——小小世界，完工！" },
  bads: [
    { when:s=>lv(s,"slime")===1, big:"🫠 BAD END · 黏糊糊", msg:"角落那灘黏液始終沒打起精神，世界的齒輪也跟著發黏……" },
    { when:(s,f)=>f.hornScare&&lv(s,"ball")<3, big:"😱 BAD END · 嚇破膽", msg:"被喇叭嚇回原形的球，再也不敢滾出來了。" },
    { when:s=>lv(s,"stone")<4, big:"⛰️ BAD END · 沉睡的巨人", msg:"箱子送來之後，石頭就再也沒有長大。巨人沉睡不醒。" },
    { when:s=>lv(s,"gear")<4, big:"⚙️ BAD END · 停擺", msg:"機關缺了最後一轉，風車紋絲不動，大家面面相覷。" },
    { when:s=>lv(s,"magnet")<2, big:"🌑 BAD END · 熄燈", msg:"浮空燈塔沒有升起。夜幕降臨，小小世界一片漆黑。" },
    { when:()=>true, big:"💤 BAD END", msg:"半成品的世界，靜靜等待下一位挑戰者。" },
  ],
  almost: n=>`只差「${n}」沒有 LEVEL MAX——再想想順序！`,
};
const METRICS = {
  total:3628800, solutions:1, ge9:649, ge8:52640, avg:"3.08",
  dist:[40320,986160,993630,186166,341052,534742,284344,209746,51991,648,1],
  firstMoveBest:{stone:10,drop:8,seed:9,slime:8,gear:9,box:2,ball:9,rope:9,horn:9,magnet:8},
};

/* ================= 引擎（與求解器同語意） ================= */
const N=ITEMS.length;
const IDX=Object.fromEntries(ITEMS.map((it,i)=>[it.id,i]));
const MAX=ITEMS.map(it=>it.max);
function lv(s,id){ return s[IDX[id]]||0 }
function compile(c){
  if(!c) return ()=>true;
  if(c.always) return ()=>true;
  if(c.present){ const i=IDX[c.present]; return s=>s[i]>0 }
  if(c.absent){ const i=IDX[c.absent]; return s=>s[i]===0 }
  if(c.minLevel){ const [t,n]=c.minLevel, i=IDX[t]; return s=>s[i]>=n }
  if(c.maxLevel){ const [t,n]=c.maxLevel, i=IDX[t]; return s=>s[i]<=n }
  if(c.ltPlus){ const [a,b,k]=c.ltPlus, ia=IDX[a], ib=IDX[b]; return s=>s[ia]<s[ib]+k }
  if(c.and){ const fs=c.and.map(x=>compile(x)); return s=>fs.every(f=>f(s)) }
  return ()=>false;
}
const TICK=ITEMS.map((it,i)=>{
  const base=compile(it.tick);
  const extras=(EXTRA[it.id]||[]).map(x=>compile(x));
  return s=>base(s)&&extras.every(f=>f(s));
});
const STALLC=STALL.map(r=>({ti:IDX[r.target], f:compile(r.when), cause:r.cause, story:r.story}));
const FXC=ITEMS.map(it=>(FX[it.id]||[]).map(e=>({...e, ti:IDX[e.t], f:compile(e.req)})));

function stepTurn(s, pi){
  s[pi]=1;
  const tl=[];
  for(const e of FXC[pi]){
    if(s[e.ti]>0 && e.f(s)){
      const before=s[e.ti];
      s[e.ti]=Math.max(1,Math.min(MAX[e.ti], s[e.ti]+e.d));
      if(s[e.ti]!==before){
        const into = s[e.ti]>before && ITEMS[e.ti].levels[s[e.ti]-1]!==ITEMS[e.ti].levels[before-1]
          ? ITEMS[e.ti].levels[s[e.ti]-1] : null;
        tl.push({kind:"fx", cause:ITEMS[pi].id, target:ITEMS[e.ti].id,
                 to:s[e.ti], down:!!e.down, medium:e.medium, move:e.move||null, story:e.story, into});
      }
    }
  }
  for(let i=0;i<N;i++){
    if(s[i]===0||s[i]>=MAX[i]) continue;
    let stallRule=null;
    for(const r of STALLC) if(r.ti===i&&r.f(s)){stallRule=r;break}
    if(stallRule){
      if(TICK[i](s)) tl.push({kind:"stall", cause:stallRule.cause, target:ITEMS[i].id, story:stallRule.story});
      continue;
    }
    if(TICK[i](s)){
      s[i]++;
      const into = ITEMS[i].levels[s[i]-1]!==ITEMS[i].levels[s[i]-2] ? ITEMS[i].levels[s[i]-1] : null;
      const pf=PERF[ITEMS[i].id];
      tl.push({kind:"grow", cause:pf.cause, target:ITEMS[i].id,
               to:s[i], medium:pf.medium, move:pf.move, story:pf.line, into});
    }
  }
  return tl;
}
const maxedCount=s=>{let c=0;for(let i=0;i<N;i++) if(s[i]===MAX[i])c++;return c};

/* ================= 美術：圖層 [from,to] 制 ================= */

function buildPanel(){
  panel.innerHTML='';
  for(const it of ITEMS){
    const b=document.createElement('button');
    b.className='item'; b.id='btn-'+it.id; b.type='button';
    b.innerHTML=
      `<svg class="mini" viewBox="-42 -66 84 76" aria-hidden="true"><g>${
        ART[it.id].filter(([f])=>f<=1).map(([,,svg])=>svg).join("")
      }</g></svg>`+
      `<span class="nm">${it.name}</span>`;
    const pips=document.createElement('span'); pips.className='pips'; pips.id='pips-'+it.id;
    for(let i=0;i<it.max;i++){const p=document.createElement('span');p.className='pip';pips.appendChild(p)}
    b.appendChild(pips);
    const ord=document.createElement('span'); ord.className='ord'; ord.id='ord-'+it.id;
    b.appendChild(ord);
    b.addEventListener('click',()=>place(it.id,true));
    panel.appendChild(b);
  }
}
function buildSlots(){
  sceneSlots.innerHTML='';
  for(const it of ITEMS){
    const s=SLOT[it.id];
    const g=document.createElementNS(NS,'g');
    g.id='art-'+it.id;
    g.style.transform=`translate(${s.x}px, ${s.y}px) scale(${s.s})`;
    g.innerHTML=`<g class="inner ${it.idle||''}">${
      ART[it.id].map(([f,t,svg])=>`<g class="L" data-f="${f}" data-t="${t}">${svg}</g>`).join("")
    }</g>`;
    g.style.visibility='hidden';
    sceneSlots.appendChild(g);
  }
}
/* 跨物件道具：小溪（水滴≥2 澆灌大樹）、纜車索道（繩子≥3） */
function cablePts(){
  const a=SLOT.seed, b=SLOT.box;
  return {ax:a.x+6, ay:a.y-66, bx:b.x+30, by:b.y-54};
}
function cableAt(t){
  const {ax,ay,bx,by}=cablePts();
  const mx=(ax+bx)/2, my=Math.min(ay,by)-24;
  const u=1-t;
  return {x:u*u*ax+2*u*t*mx+t*t*bx, y:u*u*ay+2*u*t*my+t*t*by};
}
function renderProps(){
  propsG.innerHTML=''; cableG.innerHTML='';
  if(lv(vS,'drop')>=2 && lv(vS,'seed')>=1){
    const a=SLOT.drop, b=SLOT.seed;
    const d=`M${a.x-26} ${a.y-3} C ${a.x-150} ${a.y+14}, ${b.x+180} ${b.y+76}, ${b.x+20} ${b.y+4}`;
    propsG.innerHTML=
      `<path d="${d}" fill="none" stroke="#7fc5de" stroke-width="7" stroke-linecap="round" opacity=".95"/>`+
      `<path class="flow" d="${d}" fill="none" stroke="#e9f7fd" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  if(lv(vS,'rope')>=3 && lv(vS,'seed')>=3){
    const {ax,ay,bx,by}=cablePts();
    const mx=(ax+bx)/2, my=Math.min(ay,by)-24;
    const p=cableAt(0.3);
    cableG.innerHTML=
      `<path d="M${ax} ${ay} Q ${mx} ${my} ${bx} ${by}" fill="none" stroke="#3d372c" stroke-width="3"/>`+
      `<g id="gondola" transform="translate(${p.x} ${p.y})"><g class="sway">`+
      `<line x1="0" y1="0" x2="0" y2="8" ${K2}/>`+
      `<rect x="-9" y="8" width="18" height="14" rx="4" fill="#e0633c" ${K2}/>`+
      `<circle cx="0" cy="14" r="2.4" fill="#ffe9a8" ${K2}/></g></g>`;
  }
}
function refresh(){
  let maxed=0;
  for(const it of ITEMS){
    const l=vS[IDX[it.id]];
    const pips=document.getElementById('pips-'+it.id);
    [...pips.children].forEach((p,i)=>p.classList.toggle('on', l>0 && i<l));
    pips.classList.toggle('maxed', l===it.max);
    const g=document.getElementById('art-'+it.id);
    const inner=g.querySelector('.inner');
    if(l>0){
      g.style.visibility='visible';
      inner.querySelectorAll(':scope > .L').forEach(el=>{
        const f=+el.dataset.f, t=+el.dataset.t;
        el.style.display = (l>=f && l<=t) ? '' : 'none';
      });
      if(l===it.max){
        maxed++;
        if(!inner.querySelector(':scope > .maxstar')){
          const st=document.createElementNS(NS,'g');
          st.setAttribute('class','maxstar');
          st.innerHTML=`<path transform="translate(0 ${-SLOT[it.id].top-6})" d="M0 -9 l2.6 5.3 5.9 .9 -4.3 4.1 1 5.8 -5.2 -2.8 -5.2 2.8 1 -5.8 -4.3 -4.1 5.9 -.9 z" fill="#e8b63a" ${K2}/>`;
          inner.appendChild(st);
        }
      }
    } else g.style.visibility='hidden';
  }
  renderProps();
  turnNow.textContent=order.length;
  maxNow.textContent=maxed;
  return maxed;
}
function say(t){ cap.textContent=t; cap.classList.remove('flash'); void cap.offsetWidth; cap.classList.add('flash') }
const zz=ms=>new Promise(r=>setTimeout(r, reduceMotion?0:ms/SPEED));

/* ---- 行走 ---- */
const POS={};
function curPos(id){ return POS[id]||{x:SLOT[id].x, y:SLOT[id].y} }
function homePos(id){ return {x:SLOT[id].x, y:SLOT[id].y} }
function anchor(id){ const p=curPos(id), s=SLOT[id]; return {x:p.x, y:p.y - s.top*s.s*0.6} }
function towards(aId,bId,frac){
  const a=SLOT[aId], b=SLOT[bId];
  return {x:a.x+(b.x-a.x)*frac, y:a.y+(b.y-a.y)*0.35*frac};
}
function setPos(id, pt, durMs){
  POS[id]=pt;
  const g=document.getElementById('art-'+id), s=SLOT[id];
  g.style.transition = durMs>0 ? `transform ${durMs}ms ease-in-out` : 'none';
  g.style.transform = `translate(${pt.x}px, ${pt.y}px) scale(${s.s})`;
}
async function walkTo(id, pt, ms){
  if(reduceMotion){ setPos(id, pt, 0); return }
  setPos(id, pt, ms/SPEED);
  const inner=document.querySelector('#art-'+id+' .inner');
  inner.classList.add('walkA');
  await zz(ms);
  inner.classList.remove('walkA');
}

  note:   `<path d="M0 -8 q0 -5 5 -6 l0 10 a3.2 3.2 0 1 1 -2 -3 z" fill="#5a3b63" stroke="#3d372c" stroke-width="1.5"/>`,
  part:   `<g><circle r="4.5" fill="#b8874a" ${K2}/><path d="M0 -8 v3 M0 8 v-3 M-8 0 h3 M8 0 h-3" stroke="#3d372c" stroke-width="2.5" stroke-linecap="round"/></g>`,
  plank:  `<rect x="-7" y="-2.5" width="14" height="5" rx="1.5" fill="#c9a15f" ${K2} transform="rotate(-18)"/>`,
  strand: `<rect x="-8" y="-1.8" width="16" height="3.6" rx="1.8" fill="#c9a15f" ${K2} transform="rotate(24)"/>`,
  spark:  `<path d="M-5 -7 l4 4 -3 1 7 9 -4 -4 3 -1 z" fill="#ffd45e" stroke="#3d372c" stroke-width="1.5"/>`,
  polish: `<path d="M0 -5 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 z" fill="#ffffff" ${K2}/>`,
  dig:    `<circle r="3.6" fill="#a98457" ${K2}/>`,
  pebble: `<circle r="4.2" fill="#bdb3a2" ${K2}/>`,
  soundwave:`<path d="M-3 -8 q8 8 0 16" fill="none" stroke="#c0442c" stroke-width="3" stroke-linecap="round"/>`,
};
async function mediumFly(kind, fromId, toId){
  if(reduceMotion) return;
  const to=anchor(toId);
  let from;
  if(fromId && fromId!==toId) from=anchor(fromId);
  else from={x:to.x+(Math.random()*16-8), y:to.y-54};
  const dur=0.65/SPEED;
  for(let i=0;i<3;i++){
    const g=document.createElementNS(NS,'g');
    const jx=(Math.random()*18-9), jy=(Math.random()*10-5);
    g.setAttribute('transform',`translate(${from.x+jx} ${from.y+jy})`);
    g.innerHTML=SPRITE[kind]||SPRITE.polish;
    g.classList.add('fly');
    g.style.setProperty('--dx',(to.x-from.x)+'px');
    g.style.setProperty('--dy',(to.y-from.y)+'px');
    g.style.setProperty('--dur',dur+'s');
    g.style.animationDelay=(i*0.1/SPEED)+'s';
    fxLayer.appendChild(g); setTimeout(()=>g.remove(), (dur+0.4)*1000);
  }
  await zz(T.medium);
}
function fxBurst(toId){
  const p=anchor(toId);
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${p.x} ${p.y})`);
  for(let i=0;i<6;i++){
    const ang=(Math.PI*2/6)*i - Math.PI/2;
    const st=document.createElementNS(NS,'path');
    st.setAttribute('d','M0 -6 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6 -1.9 -3.6 1.9 .7 -4 -2.9 -2.8 4 -.6 z');
    st.setAttribute('fill', i%2 ? '#e8b63a' : '#d96a3b');
    st.setAttribute('class','burststar');
    st.style.setProperty('--bx', Math.cos(ang)*24+'px');
    st.style.setProperty('--by', Math.sin(ang)*24+'px');
    g.appendChild(st);
  }
  fxLayer.appendChild(g); setTimeout(()=>g.remove(),700);
}
function fxFirework(x,y){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${x} ${y})`);
  const cols=['#e8b63a','#d96a3b','#7fc5de','#f5b0c3','#8fd97c'];
  for(let i=0;i<10;i++){
    const ang=(Math.PI*2/10)*i;
    const st=document.createElementNS(NS,'circle');
    st.setAttribute('r','4');
    st.setAttribute('fill', cols[i%cols.length]);
    st.setAttribute('class','fw');
    st.style.setProperty('--bx', Math.cos(ang)*46+'px');
    st.style.setProperty('--by', Math.sin(ang)*46+'px');
    g.appendChild(st);
  }
  fxLayer.appendChild(g); setTimeout(()=>g.remove(),1000);
}
function fxLabel(toId, txt, down){
  const a=anchor(toId);
  const t=document.createElementNS(NS,'text');
  t.textContent=txt;
  t.setAttribute('x',a.x); t.setAttribute('y',a.y - 16);
  t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','14'); t.setAttribute('font-weight','900');
  t.setAttribute('fill', down?'#c0442c':'#d96a3b'); t.setAttribute('stroke','#fff');
  t.setAttribute('stroke-width','3.5'); t.setAttribute('paint-order','stroke');
  t.setAttribute('class','float'+(down?' down':''));
  fxLayer.appendChild(t); setTimeout(()=>t.remove(),1100);
}
function fxStallMark(id){
  const a=anchor(id);
  const t=document.createElementNS(NS,'text');
  t.textContent='💢';
  t.setAttribute('x',a.x+14); t.setAttribute('y',a.y - 10);
  t.setAttribute('font-size','16'); t.setAttribute('class','angry');
  fxLayer.appendChild(t); setTimeout(()=>t.remove(),1100);
}
function anim(id, cls){
  const inner=document.querySelector('#art-'+id+' .inner');
  if(!inner) return;
  inner.classList.remove('pop','bump','shrink','nudge','chargeA');
  void inner.getBBox(); inner.classList.add(cls);
  setTimeout(()=>inner.classList.remove(cls),560);
}
function byIdName(id){ return ITEMS[IDX[id]].name }

/* ---- 三幕演出 ---- */
async function playEvent(e){
  if(e.kind==='stall'){
    if(e.cause && vS[IDX[e.cause]]>0) anim(e.cause,'nudge');
    fxStallMark(e.target);
    say(e.story+'……');
    await zz(T.stall);
    return;
  }
  const cause = e.cause && vS[IDX[e.cause]]>0 ? e.cause : null;
  const mv = e.move;
  if(mv==='cause' && cause && cause!==e.target)
    await walkTo(cause, towards(cause, e.target, 0.58), T.walk);
  if(mv==='target' && cause && cause!==e.target)
    await walkTo(e.target, towards(e.target, cause, 0.5), T.walk);
  if(cause && cause!==e.target){ anim(cause,'nudge'); await zz(T.nudge) }
  await mediumFly(e.medium, cause, e.target);
  anim(e.target,'chargeA'); await zz(T.charge);
  vS[IDX[e.target]]=e.to; refresh();
  if(e.down){
    anim(e.target,'shrink'); fxLabel(e.target,'!?',true);
    say(e.story);
    if(mv==='flee' && cause){ await zz(360); await walkTo(e.target, towards(e.target, cause, -0.35), T.flee) }
    await zz(T.hold);
  } else {
    anim(e.target,'bump'); fxBurst(e.target); fxLabel(e.target,'LEVEL UP!');
    say(e.story);
    await zz(e.into? 640 : T.hold);
    if(e.into){
      say(`「${byIdName(e.target)}」變成了『${e.into}』！`);
      anim(e.target,'bump');
      await zz(T.morph);
    }
  }
  const back=[];
  if(mv==='cause' && cause) back.push(walkTo(cause, homePos(cause), T.walk));
  if(mv==='target' || mv==='flee') back.push(walkTo(e.target, homePos(e.target), T.walk));
  if(back.length) await Promise.all(back);
}

async function place(id, animate){
  if(busy||S[IDX[id]]>0) return;
  busy=true;
  document.getElementById('btn-'+id).disabled=true;
  const tl=stepTurn(S, IDX[id]);
  order.push(id);
  const ob=document.getElementById('ord-'+id);
  ob.textContent=String(order.length).padStart(2,'0'); ob.style.display='block';
  if(tl.some(e=>e.kind==='fx'&&e.down&&e.target==='ball')) flags.hornScare=true;
  snapshotNow();
  vS[IDX[id]]=1;
  const g=document.getElementById('art-'+id);
  const inner=g.querySelector('.inner');
  g.style.visibility='visible';
  if(animate&&!reduceMotion){ inner.classList.add('pop'); setTimeout(()=>inner.classList.remove('pop'),550) }
  say(`「${byIdName(id)}」出現了。`);
  refresh();
  if(animate) await zz(T.place);
  for(const e of tl){ if(animate) await playEvent(e); else vS[IDX[e.target]]=e.to??vS[IDX[e.target]] }
  vS.set(S); const maxed=refresh();
  busy=false;
  if(order.length===N){ if(animate) await zz(550); await finale(maxed, animate) }
  else if(animate) await zz(T.breath);
}

/* ---- 終曲：燈塔亮起、纜車滑行、煙火 ---- */
async function finale(maxed, animate){
  if(maxed===N && animate && !reduceMotion){
    say('浮空燈塔亮了起來——');
    anim('magnet','bump');
    await zz(900);
    const gon=document.getElementById('gondola');
    if(gon){
      say('纜車，出發！');
      for(let t=0.3; t<=0.92; t+=0.04){
        const p=cableAt(t);
        gon.setAttribute('transform',`translate(${p.x} ${p.y})`);
        await zz(55);
      }
      anim('box','bump');
      await zz(400);
    }
    say('🎆 小小世界，完工！');
    fxFirework(260,110); await zz(380);
    fxFirework(500,80);  await zz(380);
    fxFirework(700,120);
    for(const it of ITEMS){ anim(it.id,'bump'); await zz(90) }
    await zz(900);
  }
  ending(maxed);
}
function ending(maxed){
  let big,msg,good=false;
  if(maxed===N){ good=true; big=ENDINGS.good.big; msg=ENDINGS.good.msg }
  else if(maxed===N-1){
    const miss=ITEMS.find(it=>S[IDX[it.id]]!==it.max);
    big="😮 ALMOST!"; msg=ENDINGS.almost(miss.name);
  } else {
    const b=ENDINGS.bads.find(b=>b.when(S,flags)); big=b.big; msg=b.msg;
  }
  endingBox.className='ending'; endingBox.hidden=false;
  endingBox.innerHTML=`
    <div class="big ${good?'good':'bad'}">${big}</div>
    <div class="msg">${msg}</div>
    <div class="score">LEVEL MAX：${maxed} / ${N}　｜　你的順序：${order.map(byIdName).join(' → ')}</div>
    <button class="ghost" id="againBtn" style="color:#fbf4e4;border-color:#fbf4e4">再挑戰一次</button>`;
  document.getElementById('againBtn').addEventListener('click',reset);
  say(good?'恭喜通關！':'差一點……換個順序試試吧。');
}

function reset(){
  S=new Int8Array(N); vS=new Int8Array(N); order=[]; busy=false; flags={hornScare:false};
  endingBox.hidden=true; endingBox.innerHTML=''; fxLayer.innerHTML='';
  for(const it of ITEMS){
    setPos(it.id, homePos(it.id), 0);
    document.getElementById('btn-'+it.id).disabled=false;
    document.getElementById('ord-'+it.id).style.display='none';
    const inner=document.querySelector('#art-'+it.id+' .inner');
    const st=inner.querySelector(':scope > .maxstar'); if(st) st.remove();
  }
  say('空空的小世界。第一手要放什麼？');
  refresh(); snapshotNow();
}

function renderSpecPanel(){
  const dump={items:ITEMS.map(({id,name,max,tick,levels})=>({id,name,max,tick,levels})), extra:EXTRA, fx:FX, stall:STALL, perf:PERF,
    props:{stream:"水滴≥2 且種子在場 → 池塘到大樹出現流動小溪", cable:"繩子≥3 且大樹長成 → 樹冠到纜車站拉出索道與吊艙", beacon:"磁鐵≥2 → 浮空燈塔＋光束與地面影子", finale:"全滿級 → 燈塔亮起、吊艙滑行到站、三發煙火、全員謝幕"}};
  document.getElementById('specDump').textContent=JSON.stringify(dump,null,2);
  const m=METRICS;
  document.getElementById('metricsBox').innerHTML=`
    <p>求解器掃過全部 10! = <b>${m.total.toLocaleString()}</b> 種排列：唯一解 <b>${m.solutions}</b> 組、
    達成 9/10 的排列 <b>${m.ge9.toLocaleString()}</b>、8/10 以上 <b>${m.ge8.toLocaleString()}</b>，
    平均滿級數 <b>${m.avg}</b>。</p>
    <table><tr><th>滿級數</th>${m.dist.map((_,k)=>`<td>${k}</td>`).join('')}</tr>
    <tr><th>排列數</th>${m.dist.map(v=>`<td>${v.toLocaleString()}</td>`).join('')}</tr></table>
    <p>各首手的「可達最佳滿級數」：${Object.entries(m.firstMoveBest).map(([id,v])=>`${ITEMS[IDX[id]].name} ${v}`).join('、')}。
    演出＝因(nudge)→媒介(fly)→果(charge→變身→定格) 三幕，跨物件道具規則見 props 欄。</p>`;
}

let snapshotNow=()=>{};
function boot(data){
  buildPanel(); buildSlots();
  document.getElementById('resetBtn').addEventListener('click',reset);
  const sb=document.getElementById('speedBtn');
  sb.addEventListener('click',()=>{
    SPEED = SPEED===1 ? 3 : 1;
    sb.classList.toggle('on', SPEED!==1);
    sb.textContent = SPEED===1 ? '⏩ 快轉' : '▶ 原速';
  });
  renderSpecPanel();
  reset();
  const saved=data&&Array.isArray(data.order)?data.order:null;
  if(saved) for(const id of saved) if(IDX[id]!=null&&S[IDX[id]]===0){
    const tl=stepTurn(S,IDX[id]); order.push(id);
    if(tl.some(e=>e.kind==='fx'&&e.down&&e.target==='ball')) flags.hornScare=true;
    document.getElementById('btn-'+id).disabled=true;
    const ob=document.getElementById('ord-'+id);
    ob.textContent=String(order.length).padStart(2,'0'); ob.style.display='block';
  }
  vS.set(S);
  const maxed=refresh();
  if(order.length===N) ending(maxed);
  snapshotNow=()=>window.claude?.hot?.snapshot?.(()=>({order:[...order]}));
  snapshotNow();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
